services:
  app:
    build:
      context: .
      args:
        AUTH_SECRET: ${AUTH_SECRET}
    restart: "no"
    networks: [mb-edge]
    env_file:
      - .env
    volumes:
      - appdata:/app/data
    labels:
      - traefik.enable=true
      - mb.env=preview
      - mb.owner=${CODER_USER:?CODER_USER chua duoc dat}
      - mb.autostop=4
      # Domain đọc từ biến APP_HOST (đổi 17/09/2026) — không ghi cứng host nội bộ
      # trong repo công khai. Đặt APP_HOST trong .env trước khi `docker compose up`.
      - "traefik.http.routers.ads-manager-${CODER_USER}.rule=Host(`${APP_HOST:?APP_HOST chua duoc dat}`)"
      - traefik.http.routers.ads-manager-${CODER_USER}.entrypoints=websecure
      - traefik.http.routers.ads-manager-${CODER_USER}.tls.certresolver=le
      - traefik.http.services.ads-manager-${CODER_USER}.loadbalancer.server.port=3000
      - traefik.http.routers.ads-manager-${CODER_USER}.middlewares=mb-local@file

networks:
  mb-edge:
    external: true

volumes:
  appdata:
